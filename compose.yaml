services:
  sensor:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
