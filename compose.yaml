name: php2shell-pot
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-restrictions: &restrictions
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  restart: unless-stopped
  logging: *logging

services:
  guard:
    build: ./docker/guard
    <<: *restrictions
    cap_add: [NET_ADMIN]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${SSH_PORT:-2222}:2222"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    healthcheck:
      test: [CMD-SHELL, "iptables -S OUTPUT | grep -q '^-P OUTPUT DROP' && iptables -C OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT && test $$(cat /proc/sys/net/ipv6/conf/all/disable_ipv6) = 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 64m
    cpus: 0.25

  sensor:
    build: .
    image: php2shell-sensor:local
    <<: *restrictions
    network_mode: service:guard
    depends_on:
      guard:
        condition: service_healthy
    command: ["--host", "0.0.0.0", "--data", "/data", "--quota-mib", "${HTTP_QUOTA_MIB:-4096}"]
    volumes:
      - http-data:/data
    mem_limit: 512m
    cpus: 1
    healthcheck:
      # Check the database, not a loopback TCP probe: new outbound sockets are blocked.
      test: [CMD, python, -c, "import sqlite3; c=sqlite3.connect('file:/data/events.sqlite3?mode=ro',uri=True); c.execute('SELECT 1 FROM events LIMIT 1'); c.close()"]
      interval: 30s
      timeout: 3s
      retries: 3

  ssh:
    image: ${COWRIE_IMAGE:-cowrie/cowrie:3.1.3@sha256:69e3317c6ecf8811d18faecb8a2fcedee0af1f0f864b50de07b688c7409f515c}
    <<: *restrictions
    network_mode: service:guard
    depends_on:
      guard:
        condition: service_healthy
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 512m
    cpus: 1

  tools:
    image: php2shell-sensor:local
    build: .
    profiles: [tools]
    entrypoint: [python, /app/trace.py]
    command: [--help]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - http-data:/data:ro
      - cowrie-var:/cowrie:ro
    mem_limit: 256m
    cpus: 1

  probe:
    image: php2shell-sensor:local
    build: .
    profiles: [test]
    entrypoint: [python, -m, http.server, "9090"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  http-data:
  cowrie-var:
